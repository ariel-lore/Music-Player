name: Build APK (debug)

on:
  workflow_dispatch:
  push:
    branches: [fix/playback-stuck-self-heal]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install Android SDK components
        # The runner's sdkmanager is built for JDK 17 (class file 61), while the
        # 2020-era Gradle/AGP build needs JDK 11. Use JDK 17 for this step only
        # (JAVA_HOME_17_X64 is preinstalled on the ubuntu runner); the build step
        # below still gets JDK 11 from the setup-java action.
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-30" "build-tools;30.0.2"

      - name: Replace dead jcenter() repo with mirrors (CI only, not committed)
        run: |
          sed -i 's|jcenter()|mavenCentral()\n        maven { url "https://maven.aliyun.com/repository/jcenter" }|' build.gradle

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: music-player-debug
          path: app/build/outputs/apk/debug/
